    <div class="modal-backdrop hidden" id="projectManageModal" role="dialog" aria-modal="true" aria-labelledby="projectManageTitle">
      <div class="modal project-manage-modal">
        <div class="modal-header project-manage-header">
          <button class="secondary-button project-manage-back hidden" id="projectManageBack" type="button">返回项目列表</button>
          <div class="project-manage-heading">
            <p class="modal-label">项目管理</p>
            <h2 id="projectManageTitle">管理项目</h2>
            <p class="modal-description" id="projectManageDescription">集中管理项目名称、归档文件和项目数据。</p>
          </div>
          <button class="modal-close" id="projectManageClose" type="button" aria-label="关闭">×</button>
        </div>

        <div class="project-manage-feedback hidden" id="projectManageFeedback" role="status" aria-live="polite"></div>

        <div class="modal-body project-manage-body">
          <section class="project-manage-view" id="projectManageListView">
            <div class="project-manage-toolbar">
              <label class="project-search-field">
                <span class="visually-hidden">搜索项目</span>
                <input id="projectManageSearch" type="search" placeholder="搜索项目名称或标识" autocomplete="off" />
              </label>
              <div class="project-manage-create-actions">
                <button class="secondary-button" id="projectManageImport" type="button">导入项目</button>
                <button class="primary-button" id="projectManageCreate" type="button">新增项目</button>
              </div>
            </div>
            <p class="project-manage-summary" id="projectManageSummary">共 0 个项目</p>
            <div class="project-table-wrap">
              <table class="project-table">
                <thead>
                  <tr>
                    <th>项目</th>
                    <th>项目标识</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="projectManageTableBody"></tbody>
              </table>
              <div class="project-manage-empty hidden" id="projectManageEmpty">没有匹配的项目。</div>
            </div>
          </section>

          <section class="project-manage-view hidden" id="projectCreateView">
            <label class="form-field">
              <span>项目标识</span>
              <input id="newProjectKey" type="text" placeholder="huazai3-ui" autocomplete="off" />
            </label>
            <label class="form-field">
              <span>项目名称</span>
              <input id="newProjectName" type="text" placeholder="华债被测系统" autocomplete="off" />
            </label>
            <p class="form-help" id="projectCreateWorkspaceHint">项目目录将自动创建到配置的工作区根目录下。</p>
            <div class="admin-form-grid project-directory-grid">
              <label class="form-field">
                <span>计划目录</span>
                <input id="newProjectSpecsDir" type="text" value="specs" autocomplete="off" />
              </label>
              <label class="form-field">
                <span>脚本目录</span>
                <input id="newProjectTestsDir" type="text" value="tests" autocomplete="off" />
              </label>
            </div>
            <label class="form-field">
              <span>描述</span>
              <input id="newProjectDescription" type="text" placeholder="可选" autocomplete="off" />
            </label>
          </section>

          <section class="project-manage-view hidden" id="projectImportView">
            <label class="form-field">
              <span>导入文件</span>
              <input id="projectImportFile" type="file" accept=".zip,application/zip,application/x-zip-compressed" />
            </label>
            <label class="form-field">
              <span>项目标识</span>
              <input id="importProjectKey" type="text" placeholder="留空使用导出包中的项目标识" autocomplete="off" />
            </label>
            <label class="form-field">
              <span>项目名称</span>
              <input id="importProjectName" type="text" placeholder="留空使用导出包中的项目名称" autocomplete="off" />
            </label>
            <p class="form-help" id="projectImportWorkspaceHint">导入会在配置的工作区根目录下创建新项目。</p>
            <div class="admin-form-grid project-directory-grid">
              <label class="form-field">
                <span>计划目录</span>
                <input id="importProjectSpecsDir" type="text" placeholder="specs" autocomplete="off" />
              </label>
              <label class="form-field">
                <span>脚本目录</span>
                <input id="importProjectTestsDir" type="text" placeholder="tests" autocomplete="off" />
              </label>
            </div>
            <label class="form-field">
              <span>描述</span>
              <input id="importProjectDescription" type="text" placeholder="留空使用导出包中的描述" autocomplete="off" />
            </label>
          </section>

          <section class="project-manage-view hidden" id="projectEditView">
            <label class="form-field">
              <span>项目标识</span>
              <input id="editProjectKey" type="text" readonly />
            </label>
            <label class="form-field">
              <span>项目名称</span>
              <input id="editProjectName" type="text" autocomplete="off" />
            </label>
            <label class="form-field">
              <span>描述</span>
              <input id="editProjectDescription" type="text" placeholder="可选" autocomplete="off" />
            </label>
            <p class="form-help">项目标识和工作区目录创建后不可修改。</p>
          </section>
        </div>

        <div class="modal-footer hidden" id="projectCreateFooter">
          <button class="secondary-button" id="projectCreateCancel" type="button">取消</button>
          <button class="primary-button" id="projectCreateSubmit" type="button">创建并切换</button>
        </div>
        <div class="modal-footer hidden" id="projectImportFooter">
          <button class="secondary-button" id="projectImportCancel" type="button">取消</button>
          <button class="primary-button" id="projectImportSubmit" type="button">导入并切换</button>
        </div>
        <div class="modal-footer hidden" id="projectEditFooter">
          <button class="secondary-button" id="projectEditCancel" type="button">取消</button>
          <button class="primary-button" id="projectEditSubmit" type="button">保存修改</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop project-delete-backdrop hidden" id="projectDeleteModal" role="dialog" aria-modal="true" aria-labelledby="projectDeleteTitle">
      <div class="modal compact-modal project-delete-modal">
        <div class="modal-header">
          <div>
            <p class="modal-label">危险操作</p>
            <h2 id="projectDeleteTitle">确认删除项目</h2>
            <p class="modal-description">删除后，项目数据库数据和本地工作区目录都无法恢复。</p>
          </div>
          <button class="modal-close" id="projectDeleteClose" type="button" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <div class="project-delete-warning">
            <strong id="projectDeleteName"></strong>
            <span id="projectDeleteKey"></span>
          </div>
          <label class="form-field">
            <span>请输入完整项目名称以确认删除</span>
            <input id="projectDeleteConfirmation" type="text" autocomplete="off" />
          </label>
        </div>
        <div class="modal-footer">
          <button class="secondary-button" id="projectDeleteCancel" type="button">取消</button>
          <button class="secondary-button danger-button" id="projectDeleteSubmit" type="button" disabled>永久删除</button>
        </div>
      </div>
    </div>
