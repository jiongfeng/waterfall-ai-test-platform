[project]
name = "waterfall-ai-test-platform"
version = "0.1.0b0"
description = "Agent-driven test automation platform for planning, generating, running, and reviewing Playwright tests."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
dependencies = [
  "Flask==3.1.3",
  "Markdown==3.10.3",
  "nh3==0.3.7",
  "PyMySQL==1.2.0",
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
  "pip-audit>=2.9,<3",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "project-template",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501", "F401"]
"test_plan_viewer/__init__.py" = ["F401"]
"test_plan_viewer/*/__init__.py" = ["F401"]
"tests/*.py" = ["E501"]
