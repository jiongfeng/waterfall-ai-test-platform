name: 缺陷报告
description: 报告受支持 Beta 环境中可复现的功能或可靠性问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。当前 Beta 只支持可信环境、单租户、Linux Docker 部署。

        安全漏洞请停止填写本表单，改用仓库 Security 页面中的 **Report a vulnerability**。不要在公开 Issue 中提交凭据、Token、Cookie、内部地址、客户数据、完整日志、视频或 trace。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
        - label: 我已删除日志、截图和配置中的秘密与个人信息。
          required: true

  - type: dropdown
    id: deployment_scope
    attributes:
      label: 部署边界
      description: 不受支持的环境仍可记录，但维护者可能无法复现或修复。
      options:
        - 受支持：可信环境、单租户、Linux Docker
        - 不受支持或不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 提供提交 SHA、标签或容器镜像标识。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 列出 Linux 发行版、Docker Engine、Compose、浏览器、Python、Node.js、MySQL 和 Playwright 版本中与问题有关的部分。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 使用隔离数据，给出能够稳定重现问题的最少步骤。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏证据
      description: 提供最短必要日志、错误响应或截图说明；不要上传完整诊断包或数据库转储。
      render: shell

  - type: textarea
    id: investigation
    attributes:
      label: 已尝试的排查
      description: 说明已经验证的配置、重启、回滚或最小化步骤。

  - type: dropdown
    id: impact
    attributes:
      label: 影响
      options:
        - 阻断核心流程或可能损坏数据
        - 主要功能不可用但有绕过方式
        - 局部功能异常
        - 体验或文档问题
    validations:
      required: true
