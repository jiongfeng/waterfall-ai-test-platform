name: 功能建议
description: 提议符合项目定位的新能力或改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        当前项目是面向可信团队的单租户 Linux Docker Beta。请从待解决的问题出发，不要把公网 SaaS、多租户隔离、Windows 原生生产部署或高可用能力描述成现有承诺。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和路线图。
          required: true
        - label: 建议中不包含凭据、内部地址、客户数据或未公开漏洞。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前用户任务、阻碍和影响，不要只描述期望的界面或技术。
    validations:
      required: true

  - type: textarea
    id: users
    attributes:
      label: 用户与场景
      description: 说明谁在什么受支持环境中遇到问题，以及出现频率。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述可观察行为、主要流程和验收标准。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 列出已经考虑的配置、工作流或更小范围方案。

  - type: textarea
    id: security
    attributes:
      label: 安全、隐私和运维影响
      description: 说明权限、秘密、模型数据、网络、存储、迁移、备份、依赖和许可证影响。
    validations:
      required: true

  - type: dropdown
    id: boundary
    attributes:
      label: 与 Beta 边界的关系
      options:
        - 保持可信环境、单租户、Linux Docker 边界
        - 希望扩展边界，需要先做威胁模型与治理决策
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与方式
      options:
        - label: 如果方向被接受，我愿意协助设计、实现、测试或文档。
